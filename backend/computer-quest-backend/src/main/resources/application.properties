spring.application.name=computer-quest-backend

# Database configuration with Environment Variable overrides for Cloud Deployment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/computer_quest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:8344}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Cloud Connection Pool Optimization (Render / PostgreSQL)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=10000

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# CORS allowed origins configuration
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

# Server Port
server.port=${PORT:8080}