version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: computer_quest_db
    environment:
      POSTGRES_DB: computer_quest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend/computer-quest-backend
      dockerfile: Dockerfile
    container_name: computer_quest_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/computer_quest
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_secure_password
      PORT: 8080
      ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:
